<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Panel Cliente</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="client-container">
    <ion-card class="welcome-card">
      <ion-card-header>
        <ion-card-title>¡Hola, {{ currentUser()?.name || 'Cliente' }}!</ion-card-title>
        <ion-card-subtitle>Rol: {{ currentUser()?.role }} | Teléfono: {{ currentUser()?.phone || 'Sin registrar' }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>Sesión iniciada correctamente con token JWT.</p>
        <ion-button fill="outline" color="danger" size="small" (click)="logout()" class="ion-margin-top">
          Cerrar Sesión
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
